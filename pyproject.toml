[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pwre"
version = "0.1.0"
description = "DSH 用的逆向军刀：一条命令看清一个二进制、一个固件、一个安装包"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pefile>=2023.2.7",
    "pyelftools>=0.31",
    "capstone>=5.0",
    "zstandard>=0.22",
    "pyserial>=3.5",
]

[project.scripts]
re = "pwre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwre = ["ghidra_scripts/*.java"]
